name: Vitest

on:
  push:
    branches: [main]
    paths:
      - "resources/js/**"
      - "package.json"
      - "package-lock.json"
      - "vitest.config.ts"
      - ".github/workflows/vitest.yml"
  pull_request:

jobs:
  vitest:
    uses: Scrapkit/ci-pipeline/.github/workflows/vitest.yml@v1
    with:
      node-version: "22"

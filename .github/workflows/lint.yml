name: Lint

on:
  push:
    branches: [main]
    paths:
      - "**/*.js"
      - "**/*.jsx"
      - "**/*.ts"
      - "**/*.tsx"
      - "package.json"
      - "package-lock.json"
      - "eslint.config.js"
      - ".github/workflows/lint.yml"
  pull_request:

jobs:
  eslint:
    uses: Scrapkit/ci-pipeline/.github/workflows/js-eslint.yml@v1
    with:
      node-version: "22"
      max-warnings: "0"

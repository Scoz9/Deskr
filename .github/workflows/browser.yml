name: Browser

on:
  push:
    branches: [staging]
    paths:
      - "app/**"
      - "routes/**"
      - "resources/**"
      - "tests/Browser/**"
      - "composer.json"
      - "composer.lock"
      - "package.json"
      - "package-lock.json"
      - "vite.config.ts"
      - ".github/workflows/browser.yml"
  pull_request:
    paths:
      - "app/**"
      - "routes/**"
      - "resources/**"
      - "tests/Browser/**"
      - "composer.json"
      - "composer.lock"
      - "package.json"
      - "package-lock.json"
      - "vite.config.ts"
      - ".github/workflows/browser.yml"

jobs:
  pest-browser:
    uses: Scrapkit/ci-pipeline/.github/workflows/pest-browser.yml@v1
    with:
      php-version: "8.4"
      node-version: "22"
      database: "mariadb"
